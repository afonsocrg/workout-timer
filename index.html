<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Timer" />
  <title>Workout Timer</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Home: activity calendar + row of workouts (tap to start) -->
  <main id="home" class="view page tabbed">
    <header class="page-header">
      <h1>Workout Timer</h1>
    </header>

    <section class="cal">
      <div class="cal-head">
        <div class="cal-title">
          <div id="cal-month"></div>
          <div id="cal-stats" class="cal-stats"></div>
        </div>
        <button id="cal-prev" class="icon-btn cal-nav" type="button" aria-label="Previous month">‹</button>
        <button id="cal-next" class="icon-btn cal-nav" type="button" aria-label="Next month">›</button>
      </div>
      <div class="cal-grid cal-weekdays" aria-hidden="true">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      <div id="cal-days" class="cal-grid"></div>
    </section>

    <h2 class="section-title">Start a workout</h2>
    <div id="quick-row" class="quick-row"></div>
  </main>

  <!-- Workouts tab: list of saved workouts (tap to edit) -->
  <main id="workouts" class="view page tabbed hidden">
    <header class="page-header with-action">
      <h1>Workouts</h1>
      <button id="add-workout" class="header-action" type="button" aria-label="New workout">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div id="workout-list" class="list"></div>
  </main>

  <!-- Log tab: completed workouts -->
  <main id="log" class="view page tabbed hidden">
    <header class="page-header">
      <h1>Log</h1>
      <div id="log-stats" class="log-stats"></div>
    </header>
    <div id="log-list"></div>
  </main>

  <!-- Bottom tab bar -->
  <nav id="tabbar" class="tabbar" aria-label="Main">
    <button type="button" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button type="button" data-tab="workouts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5M12 2.5V5"/></svg>
      <span>Workouts</span>
    </button>
    <button type="button" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8.5 15l2.5 2.5 4.5-4.5"/></svg>
      <span>Log</span>
    </button>
  </nav>

  <!-- Workout editor -->
  <main id="edit" class="view page hidden">
    <header class="edit-header">
      <button id="edit-back" class="icon-btn back" type="button" aria-label="Back to workouts">‹</button>
      <input id="wo-name" class="wo-name" type="text" maxlength="40" placeholder="Workout name" />
    </header>
    <div id="items" class="items"></div>
    <!-- Sum of the rows above, in the same column as their times -->
    <div class="items-total">
      <span class="items-total-label">Total</span>
      <span id="total-time" class="items-total-time">0:00</span>
    </div>
    <div id="items-empty" class="empty-state hidden">Empty workout. Add a step below.</div>

    <h2 class="section-title add-title">Add</h2>
    <div class="add-grid">
      <button type="button" class="add-card is-work" data-add="work"><b>Work</b><small>One exercise</small></button>
      <button type="button" class="add-card is-rest" data-add="rest"><b>Rest</b><small>A break</small></button>
      <button type="button" class="add-card" data-add="intervals"><b>Intervals</b><small>Repeat steps</small></button>
    </div>

    <div class="edit-extra">
      <button id="duplicate" class="text-btn muted" type="button">Duplicate</button>
      <button id="delete" class="text-btn danger" type="button">Delete</button>
    </div>

    <div class="start-bar">
      <div class="start-bar-inner">
        <button id="start" class="btn secondary" type="button" aria-label="Start workout">
          <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2 L13 7 L4 12 Z"/></svg>
          Start
        </button>
        <button id="save" class="btn primary" type="button">Save</button>
      </div>
    </div>
  </main>

  <!-- Running -->
  <main id="run" class="view hidden" data-phase="prep">
    <div class="run-top">
      <div id="run-round" class="run-stat">
        <div class="run-stat-label">Round</div>
        <div class="run-round-count"><span id="run-round-num">1</span><span class="run-round-of">/<span id="run-round-total">1</span></span></div>
      </div>
      <div class="run-stat run-status">
        <div class="run-stat-label">Left</div>
        <div id="run-total" class="run-total">0:00</div>
        <div id="run-eta" class="run-eta"></div>
      </div>
    </div>

    <div class="run-center">
      <div id="run-label" class="run-label">Get ready</div>
      <div id="run-time" class="run-time">0:10</div>
      <div class="progress"><div id="run-progress"></div></div>
      <div id="run-next" class="run-next"></div>
    </div>

    <div class="run-bottom">
      <div class="controls">
        <button id="stop" class="btn ctrl" type="button">Stop</button>
        <button id="pause" class="btn ctrl big" type="button">Pause</button>
        <button id="skip" class="btn ctrl" type="button">Skip</button>
      </div>
    </div>
  </main>

  <!-- Finished -->
  <main id="done" class="view hidden">
    <div class="done-center">
      <div class="done-title">Done!</div>
      <div class="done-sub"><span id="done-name"></span> · <span id="done-time"></span></div>
      <div id="done-week" class="done-week"></div>
      <button id="done-back" class="btn primary" type="button">Back</button>
    </div>
  </main>

  <!-- Wheel picker sheet -->
  <div id="sheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span id="sheet-title"></span>
        <button id="sheet-done" type="button">Done</button>
      </div>
      <div class="wheels">
        <div class="wheel-band"></div>
        <div id="wheels-row" class="wheels-row"></div>
      </div>
    </div>
  </div>

  <!-- Confirm dialog -->
  <div id="confirm" class="confirm hidden" aria-hidden="true">
    <div class="confirm-backdrop"></div>
    <div class="confirm-panel" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
      <div id="confirm-title" class="confirm-title"></div>
      <div id="confirm-msg" class="confirm-msg"></div>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn" type="button">Cancel</button>
        <button id="confirm-ok" class="btn danger" type="button">Delete</button>
      </div>
    </div>
  </div>

  <template id="card-tpl">
    <div class="wo-card" role="button" tabindex="0">
      <div class="wo-title"></div>
      <div class="wo-total"></div>
      <div class="wo-meta"></div>
      <svg class="wo-start-hint" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2 L13 7 L4 12 Z"/></svg>
    </div>
  </template>

  <!-- Row columns (lined up across all rows): handle · icon · name · time · delete -->
  <template id="step-tpl">
    <div class="step">
      <button class="drag-handle" type="button" aria-label="Reorder (drag, or use arrow keys)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
      <button class="kind" type="button"><svg class="ico-work" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><svg class="ico-rest" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7v10M15 7v10"/></svg></button>
      <input class="step-name" type="text" maxlength="30" />
      <span class="rest-label">Rest</span>
      <button class="pill dur" type="button"></button>
      <button class="icon-btn trash" data-act="delete" type="button" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
    </div>
  </template>

  <template id="intervals-tpl">
    <section class="block">
      <div class="block-head">
        <button class="collapse-btn" type="button" aria-label="Show or hide steps (drag to reorder)" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span class="kind is-intervals" role="img" aria-label="Intervals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></span>
        <input class="block-name" type="text" maxlength="40" placeholder="Interval name" />
        <span class="head-meta"></span>
        <button class="icon-btn trash" data-act="delete" type="button" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
      </div>
      <div class="block-stats">
        <button class="stat stat-rounds" type="button" aria-label="Rounds"><b class="stat-value"></b> <span class="stat-unit"></span></button>
        <button class="stat stat-rest" type="button" aria-label="Rest between rounds"><b class="stat-value"></b> <span class="stat-unit"></span></button>
      </div>
      <div class="steps"></div>
      <button class="add-step text-btn" type="button">+ Add step</button>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
